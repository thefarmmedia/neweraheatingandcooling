<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 298 80" role="img" aria-label="New ERA Heating and Cooling">
  <title>New ERA Heating &amp; Cooling</title>
  <!--
    Ring: 4 thin concentric arcs per color, tightly spaced (3-unit gaps).
    Radii 22/25/28/31, stroke 1.55, each arc ~165°, starting 120° apart.
    Z-order: green(back) → blue → red(front).
  -->
  <g transform="translate(40,40)">
    <!-- Green — back -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#27a040" stroke-width="1.55" stroke-dasharray="63 78"  stroke-linecap="round" transform="rotate(150)"/>
    <circle cx="0" cy="0" r="25" fill="none" stroke="#27a040" stroke-width="1.55" stroke-dasharray="72 88"  stroke-linecap="round" transform="rotate(150)"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#27a040" stroke-width="1.55" stroke-dasharray="80 99"  stroke-linecap="round" transform="rotate(150)"/>
    <circle cx="0" cy="0" r="31" fill="none" stroke="#27a040" stroke-width="1.55" stroke-dasharray="89 110" stroke-linecap="round" transform="rotate(150)"/>
    <!-- Blue — middle -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#1a50a6" stroke-width="1.55" stroke-dasharray="63 78"  stroke-linecap="round" transform="rotate(30)"/>
    <circle cx="0" cy="0" r="25" fill="none" stroke="#1a50a6" stroke-width="1.55" stroke-dasharray="72 88"  stroke-linecap="round" transform="rotate(30)"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#1a50a6" stroke-width="1.55" stroke-dasharray="80 99"  stroke-linecap="round" transform="rotate(30)"/>
    <circle cx="0" cy="0" r="31" fill="none" stroke="#1a50a6" stroke-width="1.55" stroke-dasharray="89 110" stroke-linecap="round" transform="rotate(30)"/>
    <!-- Red — front -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#cc1e1e" stroke-width="1.55" stroke-dasharray="63 78"  stroke-linecap="round" transform="rotate(-90)"/>
    <circle cx="0" cy="0" r="25" fill="none" stroke="#cc1e1e" stroke-width="1.55" stroke-dasharray="72 88"  stroke-linecap="round" transform="rotate(-90)"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#cc1e1e" stroke-width="1.55" stroke-dasharray="80 99"  stroke-linecap="round" transform="rotate(-90)"/>
    <circle cx="0" cy="0" r="31" fill="none" stroke="#cc1e1e" stroke-width="1.55" stroke-dasharray="89 110" stroke-linecap="round" transform="rotate(-90)"/>
  </g>

  <!-- Wordmark: "New" regular + "ERA" bold, italic -->
  <text y="43" font-family="'Gill Sans MT','Gill Sans',Calibri,Arial,sans-serif"
        font-size="27" font-style="italic">
    <tspan x="84" fill="#383838" font-weight="400">New</tspan><tspan fill="#0d0d0d" font-weight="800">ERA</tspan>
  </text>
  <!-- Tagline -->
  <text x="85" y="59" font-family="Arial,Helvetica,sans-serif"
        font-size="8.8" fill="#9a9a9a" letter-spacing="3.6" font-weight="400">HEATING &amp; COOLING</text>
</svg>
