<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 255">
  <defs>
    <!-- Metallic gloss gradient matching the original -->
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d0d0d"/>
      <stop offset="18%"  stop-color="#2a2a2a"/>
      <stop offset="32%"  stop-color="#787878"/>
      <stop offset="42%"  stop-color="#d0d0d0"/>
      <stop offset="52%"  stop-color="#909090"/>
      <stop offset="65%"  stop-color="#2e2e2e"/>
      <stop offset="82%"  stop-color="#111111"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
  </defs>

  <!-- "NewERA" — bold italic with metallic gradient -->
  <g transform="skewX(-10) translate(30, 0)">
    <text x="0" y="200"
          font-family="Impact, 'Arial Black', Haettenschweiler, 'Arial Narrow Bold', sans-serif"
          font-size="210" font-weight="900"
          fill="url(#chrome)">NewERA</text>
  </g>

  <!-- "HEATING & COOLING" tagline -->
  <text x="68" y="246"
        font-family="'Arial', Helvetica, sans-serif"
        font-size="21" fill="#aaaaaa" letter-spacing="13" font-weight="400">HEATING &amp; COOLING</text>
</svg>
