<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 295 88" role="img" aria-label="New ERA Heating and Cooling">
  <title>New ERA Heating &amp; Cooling</title>

  <!-- Three-arc swirl ring -->
  <g transform="translate(44,44)">
    <circle cx="0" cy="0" r="33" fill="none" stroke="#27a148" stroke-width="8.5"
            stroke-dasharray="130 77" stroke-linecap="round"
            transform="rotate(150)"/>
    <circle cx="0" cy="0" r="33" fill="none" stroke="#1a56a6" stroke-width="8.5"
            stroke-dasharray="130 77" stroke-linecap="round"
            transform="rotate(30)"/>
    <circle cx="0" cy="0" r="33" fill="none" stroke="#d42828" stroke-width="8.5"
            stroke-dasharray="130 77" stroke-linecap="round"
            transform="rotate(-90)"/>
  </g>

  <!-- Wordmark — white text for dark backgrounds -->
  <text y="43" font-family="Arial, Helvetica, sans-serif" font-size="31" letter-spacing="-0.5">
    <tspan x="96" fill="rgba(255,255,255,0.85)" font-weight="300">New</tspan><tspan fill="#ffffff" font-weight="900">ERA</tspan>
  </text>

  <!-- Tagline -->
  <text x="97" y="63" font-family="Arial, Helvetica, sans-serif" font-size="10.5"
        fill="rgba(255,255,255,0.55)" letter-spacing="2.8" font-weight="400">HEATING &amp; COOLING</text>
</svg>
