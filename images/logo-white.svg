<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 255">
  <defs>
    <!-- Silver gradient for dark backgrounds -->
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.7)"/>
      <stop offset="25%"  stop-color="rgba(255,255,255,0.85)"/>
      <stop offset="42%"  stop-color="#ffffff"/>
      <stop offset="52%"  stop-color="rgba(255,255,255,0.9)"/>
      <stop offset="68%"  stop-color="rgba(255,255,255,0.65)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.5)"/>
    </linearGradient>
  </defs>

  <!-- "NewERA" — bold italic, white/silver for dark backgrounds -->
  <g transform="skewX(-10) translate(30, 0)">
    <text x="0" y="200"
          font-family="Impact, 'Arial Black', Haettenschweiler, 'Arial Narrow Bold', sans-serif"
          font-size="210" font-weight="900"
          fill="url(#silver)">NewERA</text>
  </g>

  <!-- "HEATING & COOLING" tagline -->
  <text x="68" y="246"
        font-family="'Arial', Helvetica, sans-serif"
        font-size="21" fill="rgba(255,255,255,0.5)" letter-spacing="13" font-weight="400">HEATING &amp; COOLING</text>
</svg>
